<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs - SmartHome IoT</title>
    <style>
        :root {
            --primary: #2563eb;
            --surface: rgba(255, 255, 255, 0.76);
            --surface-dark: rgba(34, 41, 47, 0.82);
            --text: #111827;
            --muted: #4b5563;
            --border: rgba(255, 255, 255, 0.46);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #78aed6 0%, #d9c796 48%, #8c714b 100%);
        }

        .shell {
            width: min(100%, 980px);
            margin: 0 auto;
            padding: 22px 16px 98px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            margin-bottom: 20px;
        }

        .icon-link {
            display: inline-grid;
            width: 44px;
            height: 44px;
            place-items: center;
            color: white;
            text-decoration: none;
            border-radius: var(--radius);
        }

        .header-title {
            flex: 1;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-weight: 700;
        }

        .card,
        .log-row {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .card {
            padding: 18px;
            color: var(--muted);
            font-weight: 700;
        }

        .logs {
            display: grid;
            gap: 10px;
        }

        .log-row {
            display: grid;
            grid-template-columns: 76px 1fr;
            gap: 12px;
            align-items: center;
            padding: 13px 14px;
        }

        .time {
            color: var(--primary);
            font-weight: 850;
        }

        .message {
            overflow: hidden;
            color: var(--text);
            font-weight: 700;
            text-overflow: ellipsis;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #1e3844 0%, #343e36 48%, #564a32 100%);
            }

            .card,
            .log-row {
                background: var(--surface-dark);
                border-color: rgba(255, 255, 255, 0.22);
            }

            .card,
            .message {
                color: white;
            }
        }
    </style>
</head>
<body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
        <symbol id="icon-back" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-history" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7M3 4.5v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </symbol>
    </svg>

    <main class="shell">
        <header class="header">
            <a class="icon-link" href="/" aria-label="Back">
                <svg width="26" height="26"><use href="#icon-back"></use></svg>
            </a>
            <div class="header-title">
                <h1>Logs</h1>
                <p class="subtitle">Ultimele evenimente MQTT</p>
            </div>
            <svg width="28" height="28"><use href="#icon-history"></use></svg>
        </header>

        {% if logs %}
            <section class="logs" aria-label="Logs">
                {% for log in logs %}
                    <article class="log-row">
                        <span class="time">{{ log.time }}</span>
                        <span class="message">{{ log.message }}</span>
                    </article>
                {% endfor %}
            </section>
        {% else %}
            <section class="card">Nu exista evenimente inca.</section>
        {% endif %}
    </main>
</body>
</html>
