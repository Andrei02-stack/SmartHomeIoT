<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SmartHome IoT</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #0f766e;
            --surface: rgba(255, 255, 255, 0.76);
            --surface-dark: rgba(34, 41, 47, 0.82);
            --text: #111827;
            --muted: #4b5563;
            --border: rgba(255, 255, 255, 0.46);
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(180deg, #78aed6 0%, #d9c796 48%, #8c714b 100%);
        }

        button,
        input {
            font: inherit;
        }

        .shell {
            width: min(100%, 760px);
            margin: 0 auto;
            padding: 22px 16px 98px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            margin-bottom: 20px;
        }

        .icon-link {
            display: inline-grid;
            width: 44px;
            height: 44px;
            place-items: center;
            color: white;
            text-decoration: none;
            border-radius: var(--radius);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: 0;
        }

        .subtitle {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-weight: 700;
        }

        .card {
            display: grid;
            gap: 14px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .summary {
            display: grid;
            gap: 4px;
            margin-bottom: 2px;
        }

        .summary strong {
            font-size: 1.05rem;
        }

        .summary span {
            color: var(--muted);
            font-weight: 700;
        }

        label {
            display: grid;
            gap: 7px;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 800;
        }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 13px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.58);
            border: 1px solid rgba(17, 24, 39, 0.14);
            border-radius: var(--radius);
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 4px;
        }

        .button,
        .outline-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            border-radius: var(--radius);
            font-weight: 850;
            text-decoration: none;
        }

        .button {
            color: white;
            background: var(--primary);
            border: 0;
            cursor: pointer;
        }

        .outline-button {
            color: var(--secondary);
            background: transparent;
            border: 1px solid rgba(17, 24, 39, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #1e3844 0%, #343e36 48%, #564a32 100%);
            }

            .card {
                color: white;
                background: var(--surface-dark);
                border-color: rgba(255, 255, 255, 0.22);
            }

            input {
                color: white;
                background: rgba(255, 255, 255, 0.08);
                border-color: rgba(255, 255, 255, 0.18);
            }

            .summary span,
            label {
                color: rgba(255, 255, 255, 0.72);
            }

            .outline-button {
                color: #83d8ff;
                border-color: rgba(255, 255, 255, 0.14);
            }
        }

        @media (max-width: 560px) {
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
        <symbol id="icon-back" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

    <main class="shell">
        <header class="header">
            <a class="icon-link" href="/" aria-label="Back">
                <svg width="26" height="26"><use href="#icon-back"></use></svg>
            </a>
            <div>
                <h1>MQTT Settings</h1>
                <p class="subtitle">Broker Mosquitto local</p>
            </div>
        </header>

        <form class="card" method="post">
            <div class="summary">
                <strong>Status conexiune: {% if connected %}Connected{% else %}Offline{% endif %}</strong>
                <span>{{ connection_detail }}</span>
            </div>

            <label>
                Broker IP
                <input name="host" value="{{ settings.host }}" placeholder="192.168.1.100" autocomplete="off">
            </label>

            <label>
                Port MQTT
                <input name="port" value="{{ settings.port }}" inputmode="numeric" pattern="[0-9]*" placeholder="1883">
            </label>

            <label>
                Username MQTT
                <input name="username" value="{{ settings.username }}" placeholder="optional" autocomplete="username">
            </label>

            <label>
                Parola MQTT
                <input name="password" value="{{ settings.password }}" type="password" placeholder="optional" autocomplete="current-password">
            </label>

            <div class="actions">
                <button class="button" type="submit">Save</button>
                <a class="outline-button" href="/">Home</a>
            </div>
        </form>
    </main>
</body>
</html>
